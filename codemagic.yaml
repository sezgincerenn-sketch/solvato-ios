# Codemagic bulut derlemesi: iOS uygulamasını derler, imzalar ve TestFlight'a yükler (Mac gerekmez).
# Kurulum ve kullanım: docs/IOS-TEST-REHBERI.md
# Başlatma: Codemagic'te "Start new build". Native iOS iş akışları aşağıda.
definitions:
  # Native iOS iş akışlarının ortak adımları (aşağıda *ad ile kullanılır)
  native_adimlar:
    - &xcode_kontrol
      name: Xcode sürümü 26 ya da üstü mü
      script: |
        xcodebuild -version
        MAJOR=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
        if [ "$MAJOR" -lt 26 ]; then echo "Xcode $MAJOR: App Store Connect Xcode 26+ istiyor"; exit 1; fi
    - &cekirdek_test
      name: Çekirdek paket testleri (SolvatoCore)
      script: cd ios-native/SolvatoCore && swift test
    - &xcodegen
      name: Xcode projesini üret (XcodeGen)
      script: |
        brew install xcodegen
        cd ios-native && xcodegen generate
    - &ui_ekranlar
      name: UI testleri ve ekran görüntüleri
      script: |
        set -o pipefail
        # iOS simülatörü kurulu değilse indir (Xcode 26'da ayrı geliyor)
        if ! xcrun simctl list runtimes | grep -q "^iOS"; then xcodebuild -downloadPlatform iOS; fi
        xcrun simctl list runtimes
        xcrun simctl list runtimes -j > /tmp/runtimes.json
        xcrun simctl list devicetypes -j > /tmp/types.json
        python3 scripts/native-simulatorler.py /tmp/runtimes.json /tmp/types.json > /tmp/devices.txt
        cat /tmp/devices.txt
        [ "$(wc -l < /tmp/devices.txt)" -ge 3 ] || { echo "Üç simülatör bulunamadı"; exit 1; }
        mkdir -p build/ekranlar
        # Hangi cihazlar ve testler: ios-native/ui-testleri.txt (boş test listesi = hepsi)
        CIHAZLAR=$(sed -n 's/^cihazlar:[[:space:]]*//p' ios-native/ui-testleri.txt)
        TESTLER=$(sed -n 's/^testler:[[:space:]]*//p' ios-native/ui-testleri.txt)
        SADECE=""
        for t in $TESTLER; do SADECE="$SADECE -only-testing:SolvatoUITests/ScreenshotTests/$t"; done
        echo "Cihazlar: ${CIHAZLAR:-hepsi} · Testler: ${TESTLER:-hepsi}"
        # Bir kez derle, her cihazda derlemeden koş
        xcodebuild build-for-testing -project ios-native/Solvato.xcodeproj -scheme Solvato \
          -destination "generic/platform=iOS Simulator" -derivedDataPath build/dd \
          CODE_SIGNING_ALLOWED=NO < /dev/null > build/xcodebuild-derleme.log 2>&1 || true
        echo "── derleme: hatalar ──"
        grep -E "error:|: error" build/xcodebuild-derleme.log | sort -u | head -80 || true
        grep -q "TEST BUILD SUCCEEDED" build/xcodebuild-derleme.log || { tail -25 build/xcodebuild-derleme.log; exit 1; }
        while IFS='|' read -r SLUG TYPE RUNTIME; do
          if [ -n "$CIHAZLAR" ] && ! echo " $CIHAZLAR " | grep -q " $SLUG "; then continue; fi
          UDID=$(xcrun simctl create "solvato-$SLUG" "$TYPE" "$RUNTIME")
          echo "$SLUG: $TYPE ($UDID)"
          # Tam çıktı dosyaya; ekrana önce düşen testler, sonra son satırlar. Takılan test 10 dakikada kesilir.
          xcodebuild test-without-building -project ios-native/Solvato.xcodeproj -scheme Solvato \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build/dd $SADECE \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 600 \
            -resultBundlePath "build/ui-$SLUG.xcresult" < /dev/null > "build/xcodebuild-$SLUG.log" 2>&1 || true
          echo "── $SLUG: hatalar ──"
          grep -E "error:|: error|failed \(|XCTAssert|Test Case .* failed" "build/xcodebuild-$SLUG.log" | sort -u | head -80 || true
          echo "── $SLUG: son satırlar ──"
          tail -25 "build/xcodebuild-$SLUG.log"
          mkdir -p build/ekranlar
          { grep -E "error:|: error|failed \(|XCTAssert|Test Case .* failed|crash|Fatal error" "build/xcodebuild-$SLUG.log" | sort -u | head -80
            echo "── son satırlar ──"; tail -40 "build/xcodebuild-$SLUG.log"; } > "build/ekranlar/xcodebuild-$SLUG.txt" || true
          python3 scripts/native-ekranlar.py "build/ui-$SLUG.xcresult" "$SLUG" build/ekranlar || true
          # Uygulama kapandıysa simülatörün çökme raporları (hangi satırda, hangi iş parçacığında) zip'e girer
          for r in ~/Library/Logs/DiagnosticReports/Solvato*.ips; do
            [ -e "$r" ] && cp "$r" "build/ekranlar/cokme-$SLUG-$(basename "$r" .ips).txt"
          done
        done < /tmp/devices.txt
        # Görüntü olmasa da zip'ler üretilir (hata dosyaları ve çökme raporları içinde); adım sonda düşer
        mkdir -p build/ekranlar
        cd build && zip -qr native-ekranlar.zip ekranlar
        # Sohbete gönderilebilecek küçük kopya (30 MB altı): yalnız iPhone, yarı boyut, JPEG
        mkdir -p ekranlar-kucuk
        for f in ekranlar/*-iphone-koyu.png ekranlar/*-iphone-acik.png ekranlar/hata-*-iphone-*.png; do
          [ -e "$f" ] || continue
          sips -s format jpeg -s formatOptions 70 --resampleWidth 600 "$f" --out "ekranlar-kucuk/$(basename "${f%.png}").jpg" > /dev/null
        done
        # Hata mesajları ve test çıktısının özeti küçük zip'e de (sohbete gönderilince neden düştüğü görülsün)
        cp ekranlar/*.txt ekranlar-kucuk/ 2>/dev/null || true
        zip -qr native-ekranlar-kucuk.zip ekranlar-kucuk
        ls -lh native-ekranlar*.zip
        ls ekranlar | grep -q png || { echo "Ekran görüntüsü yok"; exit 1; }

workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2 # kişisel hesapta ayda 500 ücretsiz dakika
    max_build_duration: 60
    integrations:
      app_store_connect: Solvato # Codemagic'teki App Store Connect API anahtarının adı (rehber, adım 4)
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.solvato.app
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest # Apple 28 Nisan 2026'dan beri Xcode 26+ istiyor; aşağıda kontrol ediliyor
      cocoapods: default
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "testflight-*"
          include: true
    scripts:
      - name: Xcode sürümü 26 ya da üstü mü
        script: |
          xcodebuild -version
          MAJOR=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [ "$MAJOR" -lt 26 ]; then echo "Xcode $MAJOR: App Store Connect Xcode 26+ istiyor"; exit 1; fi
      - name: Bağımlılıklar
        script: npm ci
      - name: Kontrol (tür + biçim)
        script: npm run check
      - name: Uygulamayı derle ve iOS projesine kopyala
        script: |
          npm run build
          npx cap sync ios
      - name: CocoaPods
        script: cd ios/App && pod install
      - name: İmzalama ayarları
        script: xcode-project use-profiles
      - name: Build numarası (her derlemede artar)
        script: |
          # Sürüm (1.0) projede; build numarası Codemagic'in sayacından gelir, TestFlight her yüklemede daha büyüğünü ister.
          perl -pi -e "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
          grep -m1 "CURRENT_PROJECT_VERSION" ios/App/App.xcodeproj/project.pbxproj
      - name: IPA oluştur
        script: |
          cd ios/App
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false # iç test grubu (Ceren) incelemesiz alır; true dış test için Apple beta incelemesine gönderir

  # ─── Native iOS (Swift / SwiftUI, docs/PLAN.md Paket 0) ─────────────────────────────────────────────────────────
  # İki iş akışı:
  # - ios-native-test: imzasız. Çekirdek paket testleri, iPhone / küçük iPhone / iPad simülatöründe UI testleri ve
  #   ekran görüntüleri. main'e `ios-native/` klasörünü değiştiren her gönderimde kendiliğinden başlar.
  # - ios-native-testflight: aynı adımlar + imzalı derleme ve TestFlight. Elle başlatılır ("Start new build");
  #   App Store imzalaması kurulu olmalı (docs/IOS-TEST-REHBERI.md, Bölüm A ve B 5–7).
  # Ekran görüntüleri derleme çıktısında `native-ekranlar.zip` (<senaryo>-<iphone|iphone-kucuk|ipad>-<koyu|acik>.png).
  # (Bulut oturumları git etiketi gönderemediği için etiketle başlatma yok.)
  ios-native-test:
    name: Native iOS → testler ve ekranlar
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true # art arda gönderimlerde yalnızca sonuncusu derlenir
    when:
      changeset:
        includes:
          - ios-native/
          - scripts/native-ekranlar.py
          - scripts/native-simulatorler.py
          - codemagic.yaml
    scripts:
      - *xcode_kontrol
      - *cekirdek_test
      - *xcodegen
      - *ui_ekranlar
    artifacts:
      - build/native-ekranlar.zip
      - build/native-ekranlar-kucuk.zip
      - build/xcodebuild-*.log
      - /tmp/xcodebuild_logs/*.log

  ios-native-testflight:
    name: Native iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Solvato
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.solvato.app
      xcode: latest
    scripts:
      - *xcode_kontrol
      - *cekirdek_test
      - *xcodegen
      - *ui_ekranlar
      - name: İmzalama ayarları
        script: xcode-project use-profiles --project ios-native/Solvato.xcodeproj
      - name: Build numarası (her derlemede artar)
        script: |
          # React sürümünün build numaralarıyla çakışmasın diye 1000'den başlar
          N=$((1000 + BUILD_NUMBER))
          perl -pi -e "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = $N;/g" ios-native/Solvato.xcodeproj/project.pbxproj
          echo "build $N"
      - name: IPA oluştur
        script: xcode-project build-ipa --project ios-native/Solvato.xcodeproj --scheme Solvato
    artifacts:
      - build/ios/ipa/*.ipa
      - build/native-ekranlar.zip
      - build/native-ekranlar-kucuk.zip
      - build/xcodebuild-*.log
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false # iç test grubu incelemesiz alır; dış test açılınca true + Test Information
